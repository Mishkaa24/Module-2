<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Провідник квесту</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Провідник квесту</h1>
        <p class="subtitle">Твій супутник у пригоді</p>

        <div class="card">
            <img class="avatar" src="images/avatar.png" alt="Аватар">
            <h2>Нове завдання</h2>
            <p id="quest-text">Натисни кнопку, щоб отримати завдання</p>
            <button id="quest-button">Нове завдання</button>
        </div>

        <div class="card">
            <h2>Наплічник</h2>
            <ul id="inventory-list">
                <li>Наплічник порожній</li>
            </ul>
            <button id="inventory-button">Перевірити наплічник</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
